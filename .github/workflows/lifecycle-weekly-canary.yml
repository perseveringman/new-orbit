name: Lifecycle weekly canary

on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  lifecycle-weekly-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run cli -- dev:lifecycle run --all --concurrent 3
